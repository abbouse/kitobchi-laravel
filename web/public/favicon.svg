<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Flat Kitobchi Brand Blue Background -->
  <rect width="512" height="512" rx="120" fill="#0B0342" />

  <!-- The Minimalist K-Book Glyph in Solid Pure White -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spine (Vertical Stem) -->
    <line x1="148" y1="116" x2="148" y2="396" stroke-width="56" />

    <!-- Open Book Dynamic Pages (Arms of K) -->
