<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Solid Kitobchi Brand Blue Background -->
  <rect width="512" height="512" rx="120" fill="#0B0342" />

  <!-- The K-Butterfly Monogram in Solid Pure White -->
  <g fill="#FFFFFF">
    <!-- Left Spine / Butterfly Body (Solid K Stem) -->
    <rect x="124" y="106" width="54" height="300" rx="27" />

    <!-- Upper Butterfly Wing (Top Arm of K) with Wing Cell Geometry -->
    <path
      d="M 198 250
         C 208 184, 256 116, 356 108
         C 390 106, 408 132, 392 164
         C 348 238, 260 252, 198 250 Z"
    />

    <!-- Lower Butterfly Wing (Bottom Arm of K) -->
    <path
      d="M 198 262
         C 260 260, 348 274, 392 348
         C 408 380, 390 406, 356 404
         C 256 396, 208 328, 198 262 Z"
    />
  </g>

  <!-- Butterfly Wing Cell Accents (Negative Space Cuts inside the Wings) -->
  <g fill="#0B0342">
    <!-- Upper Wing Inner Drop -->
    <path
      d="M 238 234
         C 246 190, 278 148, 342 140
         C 362 138, 368 152, 356 168
         C 328 214, 276 228, 238 234 Z"
    />

    <!-- Lower Wing Inner Drop -->
    <path
      d="M 238 278
         C 276 284, 328 298, 356 344
         C 368 360, 362 374, 342 372
         C 278 364, 246 322, 238 278 Z"
    />
  </g>
</svg>