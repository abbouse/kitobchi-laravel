<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Kitobchi App Primary Background (#2980DD) -->
  <rect width="512" height="512" rx="115" fill="#2980DD"/>

  <!--
    PAGES TO WINGS (KITOBCI K)
    Icon in pure white over #2980DD Kitobchi App Primary Blue
  -->

  <!-- Left Vertical Spine (Book Spine / Stem of K) -->
  <rect x="100" y="88" width="64" height="336" rx="32" fill="#FFFFFF"/>

  <!-- Upper Wing / Page (Sweeps up and right with organic page curve) -->
  <path
    d="M 172 256
       C 172 190, 220 120, 310 96
       C 350 85, 412 88, 412 128
       C 412 165, 330 215, 256 238
       C 220 250, 190 256, 172 256 Z"
    fill="#FFFFFF"
  />

  <!-- Lower Wing / Page (Sweeps down and right with matching page curve) -->
  <path
    d="M 172 256
       C 190 256, 220 262, 256 274
       C 330 297, 412 347, 412 384
       C 412 424, 350 427, 310 416
       C 220 392, 172 322, 172 256 Z"
    fill="#FFFFFF"
  />

  <!-- Subtle inner page overlay line -->
  <path
    d="M 210 210
       C 250 168, 310 135, 370 120
       C 340 152, 280 196, 225 228 Z"
    fill="#2980DD"
    opacity="0.2"
  />
</svg>