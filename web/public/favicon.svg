<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Kitobchi Brand Blue Background -->
  <rect width="512" height="512" rx="120" fill="#0B0342" />

  <!-- Pure White Butterfly-K Mark -->
  <g fill="#FFFFFF">
    <!-- Left Stem (Spine of K / Butterfly Body) -->
    <rect x="136" y="112" width="56" height="288" rx="28" />

    <!-- Upper Butterfly Wing (Upper Arm of K) -->
    <path
      d="M 212 240
         C 220 180, 260 120, 356 112
         C 388 110, 404 136, 388 166
         C 346 236, 266 250, 212 240 Z"
    />

    <!-- Lower Butterfly Wing (Lower Arm of K) -->
    <path
      d="M 212 272
         C 266 262, 346 276, 388 346
         C 404 376, 388 402, 356 400
         C 260 392, 220 332, 212 272 Z"
    />
  </g>

  <!-- Wing Vein / Page Texture Lines in Background Blue -->
  <g fill="none" stroke="#0B0342" stroke-width="14" stroke-linecap="round">
    <!-- Upper Wing Vein Arc -->
    <path d="M 252 226 C 280 190, 320 160, 362 144" />
    <!-- Lower Wing Vein Arc -->
    <path d="M 252 286 C 280 322, 320 352, 362 368" />
  </g>
</svg>