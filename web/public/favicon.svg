<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Kitobchi App Brand Squircle Container -->
  <rect width="512" height="512" rx="124" fill="#0B0342" />

  <!-- Iconic Kitobchi 3-Book Rhythm (Ultra-bold, Minimalist, Crystal-clear at 16px) -->
  <g fill="#FFFFFF">
    <!-- Bar 1: Left tall book -->
    <rect x="138" y="112" width="60" height="288" rx="30" />
    
    <!-- Bar 2: Middle stepped book -->
    <rect x="226" y="224" width="60" height="176" rx="30" />
    
    <!-- Bar 3: Right stepped book -->
    <rect x="314" y="156" width="60" height="244" rx="30" />
  </g>
</svg>
