<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Soft shadow gradient for multi-layered book pages -->
    <linearGradient id="pageShadowUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#195498" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2980DD" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="pageShadowLower" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#195498" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2980DD" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background: Kitobchi App Primary Blue (#2980DD) -->
  <rect width="512" height="512" rx="115" fill="#2980DD"/>

  <!--
    GENTLY CURVED BOOK SPINE (STEM OF K)
    - Outer curve bends smoothly to the LEFT (chap tomonga qabariq)
    - Inner concave curve faces RIGHT towards the wings (ichkarisi qanotlarga qaraydi)
    - Moderate, elegant curve depth
  -->
  <path
    d="M 128 88
       C 112 88, 96 104, 96 120
       C 74 195, 74 317, 96 392
       C 96 408, 112 424, 128 424
       C 144 424, 156 408, 156 392
       C 136 317, 136 195, 156 120
       C 156 104, 144 88, 128 88 Z"
    fill="#FFFFFF"
  />

  <!-- ===== UPPER WING (Multi-layered Book Pages) ===== -->
  <!-- Base Outer Wing -->
  <path
    d="M 152 256
       C 152 185, 206 116, 310 92
       C 355 80, 416 85, 416 128
       C 416 168, 335 218, 256 238
       C 210 248, 178 256, 152 256 Z"
    fill="#FFFFFF"
  />

  <!-- Page 2 Layer (Middle Page Fold Shadow) -->
  <path
    d="M 188 250
       C 210 205, 260 140, 345 110
       C 375 98, 410 105, 404 125
       C 390 155, 318 200, 245 226
       C 212 235, 196 244, 188 250 Z"
    fill="url(#pageShadowUpper)"
  />

  <!-- Page 3 Delicate Feather Fold Curve (Pure White Accent) -->
  <path
    d="M 205 244
       C 230 195, 280 148, 360 124
       C 382 116, 400 120, 396 130
       C 385 155, 320 195, 255 220
       C 224 229, 210 238, 205 244 Z"
    fill="#FFFFFF"
    opacity="0.9"
  />

  <!-- ===== LOWER WING (Multi-layered Book Pages) ===== -->
  <!-- Base Outer Wing -->
  <path
    d="M 152 256
       C 178 256, 210 264, 256 274
       C 335 294, 416 344, 416 384
       C 416 427, 355 432, 310 420
       C 206 396, 152 327, 152 256 Z"
    fill="#FFFFFF"
  />

  <!-- Page 2 Layer (Middle Page Fold Shadow) -->
  <path
    d="M 188 262
       C 235 286, 318 312, 390 357
       C 404 387, 375 414, 345 402
       C 260 372, 210 307, 188 262 Z"
    fill="url(#pageShadowLower)"
  />

  <!-- Page 3 Delicate Feather Fold Curve (Pure White Accent) -->
  <path
    d="M 205 268
       C 224 274, 255 292, 320 317
       C 385 357, 396 382, 360 388
       C 280 364, 230 317, 205 268 Z"
    fill="#FFFFFF"
    opacity="0.9"
  />
</svg>