<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Kitobchi Signature Deep Royal Navy to Vibrant Sapphire) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07022C" />
      <stop offset="50%" stop-color="#0F065C" />
      <stop offset="100%" stop-color="#2D5BFF" />
    </linearGradient>

    <!-- Page Shading Gradient (Clean White to Ice Blue) -->
    <linearGradient id="pageLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2EAFF" />
    </linearGradient>
    <linearGradient id="pageRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C8D8FF" />
    </linearGradient>

    <!-- Bookmark Neon Accent (Eye-catching Vibrant Coral Gold) -->
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="100%" stop-color="#FF9966" />
    </linearGradient>

    <!-- Glow & Shadow Filters for tactile depth -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Container (Modern Superellipse with Soft Rim Glow) -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="124"
    fill="url(#bgGrad)"
  />

  <!-- Subtle Top Rim Highlight -->
  <rect
    x="18"
    y="18"
    width="476"
    height="476"
    rx="122"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-opacity="0.2"
  />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="230" r="170" fill="#3868FF" opacity="0.35" filter="blur(30px)" />

  <!-- ================= BOOK SYMBOL ================= -->
  <g filter="url(#innerGlow)">
    <!-- Bookmark Ribbon (Eye-catching hanging bookmark ribbon) -->
    <path
      d="M 256 120 L 256 220 L 238 200 L 220 220 L 220 120 Z"
      fill="url(#bookmarkGrad)"
    />

    <!-- Left Open Page Wing -->
    <path
      d="M 244 168
         C 180 144, 120 162, 102 176
         C 96 181, 92 188, 92 196
         L 92 344
         C 92 355, 101 364, 112 362
         C 142 356, 192 344, 244 366
         Z"
      fill="url(#pageLeftGrad)"
    />

    <!-- Right Open Page Wing -->
    <path
      d="M 268 168
         C 332 144, 392 162, 410 176
         C 416 181, 420 188, 420 196
         L 420 344
         C 420 355, 411 364, 400 362
         C 370 356, 320 344, 268 366
         Z"
      fill="url(#pageRightGrad)"
    />

    <!-- Elegant Middle Spine Notch -->
    <path
      d="M 244 366
         C 252 362, 260 362, 268 366
         L 268 168
         C 260 164, 252 164, 244 168
         Z"
      fill="#0B0342"
      opacity="0.85"
    />

    <!-- Reading Knowledge Sparkle / Star on top-right (Creativity badge) -->
    <path
      d="M 390 120
         C 390 138, 402 150, 420 150
         C 402 150, 390 162, 390 180
         C 390 162, 378 150, 360 150
         C 378 150, 390 138, 390 120 Z"
      fill="#FFD166"
    />

    <!-- Small Sparkle dot -->
    <circle cx="340" cy="115" r="7" fill="#FFD166" opacity="0.9" />
  </g>
</svg>
