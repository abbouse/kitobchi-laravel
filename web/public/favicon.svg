<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Soft Luxury Gradient (Kitobchi App Blue Spectrum) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C95F5"/>
      <stop offset="100%" stop-color="#1B63B6"/>
    </linearGradient>

    <!-- Soft page fold shadows -->
    <linearGradient id="pageShadowUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144B8C" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#2980DD" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2980DD" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="pageShadowLower" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#144B8C" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#2980DD" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2980DD" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background: Kitobchi App Primary Blue Soft Gradient (#3C95F5 -> #1B63B6) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)"/>

  <!-- Gently Curved Organic Book Spine (Left Stem of K) -->
  <path
    d="M 132 88
       C 114 88, 100 102, 98 120
       C 84 196, 84 316, 98 392
       C 100 410, 114 424, 132 424
       C 148 424, 160 410, 156 392
       C 144 316, 144 196, 156 120
       C 160 102, 148 88, 132 88 Z"
    fill="#FFFFFF"
  />

  <!-- ===== UPPER WING (Ultra-delicate multi-page flow) ===== -->
  <!-- Main Upper Wing -->
  <path
    d="M 150 256
       C 150 182, 206 112, 312 88
       C 358 76, 420 82, 420 126
       C 420 166, 338 216, 258 237
       C 210 248, 178 256, 150 256 Z"
    fill="#FFFFFF"
  />

  <!-- Upper Page Layer 2 (Soft Page Shadow) -->
  <path
    d="M 184 250
       C 208 202, 258 136, 345 106
       C 376 94, 412 102, 406 123
       C 392 153, 320 198, 246 224
       C 210 234, 194 243, 184 250 Z"
    fill="url(#pageShadowUpper)"
  />

  <!-- Upper Page Layer 3 (Delicate White Silk Curve Accent) -->
  <path
    d="M 204 244
       C 230 194, 282 145, 362 121
       C 385 113, 403 117, 399 128
       C 388 153, 322 193, 256 218
       C 225 228, 210 237, 204 244 Z"
    fill="#FFFFFF"
    opacity="0.95"
  />


  <!-- ===== LOWER WING (Ultra-delicate multi-page flow) ===== -->
  <!-- Main Lower Wing -->
  <path
    d="M 150 256
       C 178 256, 210 264, 258 275
       C 338 296, 420 346, 420 386
       C 420 430, 358 436, 312 424
       C 206 400, 150 330, 150 256 Z"
    fill="#FFFFFF"
  />

  <!-- Lower Page Layer 2 (Soft Page Shadow) -->
  <path
    d="M 184 262
       C 194 269, 210 278, 246 288
       C 320 314, 392 359, 406 389
       C 412 410, 376 418, 345 406
       C 258 376, 208 310, 184 262 Z"
    fill="url(#pageShadowLower)"
  />

  <!-- Lower Page Layer 3 (Delicate White Silk Curve Accent) -->
  <path
    d="M 204 268
       C 210 275, 225 284, 256 294
       C 322 319, 388 359, 399 384
       C 403 395, 385 399, 362 391
       C 282 367, 230 318, 204 268 Z"
    fill="#FFFFFF"
    opacity="0.95"
  />
</svg>