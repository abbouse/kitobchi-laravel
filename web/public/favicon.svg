<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Clean White Background -->
  <rect width="512" height="512" rx="120" fill="#FFFFFF" />

  <!-- Outer Rounded Squircle Frame in Kitobchi Navy -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="none" stroke="#0B0342" stroke-width="28" />

  <!-- The Organic Growth Letter K (Stem + 3 Knowledge Leaves/Pages) -->
  <g fill="#0B0342">
    <!-- Curved Central Stem (Arching upwards to the right) -->
    <path
      d="M 164 382
         C 180 340, 240 260, 308 190
         C 322 176, 330 184, 318 198
         C 252 272, 198 348, 186 388
         C 182 400, 160 394, 164 382 Z"
    />

    <!-- Left Knowledge Leaf / Sprouting Page (Top-Left) -->
    <path
      d="M 174 274
         C 126 270, 114 200, 148 138
         C 158 120, 172 120, 180 138
         C 214 204, 222 278, 174 274 Z"
    />

    <!-- Top-Right Knowledge Leaf / Soaring Page (Top-Right) -->
    <path
      d="M 264 266
         C 246 220, 264 154, 336 130
         C 356 124, 368 138, 388 156
         C 400 166, 396 178, 382 192
         C 328 248, 282 278, 264 266 Z"
    />

    <!-- Bottom-Right Knowledge Leaf / Foundation Page (Bottom-Right) -->
    <path
      d="M 244 334
         C 260 292, 332 294, 390 326
         C 414 340, 412 358, 392 374
         C 342 414, 264 416, 244 334 Z"
    />
  </g>
</svg>