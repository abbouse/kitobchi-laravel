<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Kitobchi Navy Background -->
  <rect width="512" height="512" rx="115" fill="#0B0342"/>

  <!-- K SPINE: Left vertical white bar -->
  <rect x="96" y="90" width="68" height="332" rx="34" fill="#FFFFFF"/>

  <!--
    UPPER WING (Forewing): Sweeps up-right from pivot point (164, 256)
    Swallowtail forewing — large, elegant, pointed tip at upper-right
  -->
  <path
    d="M 164 256
       C 178 230, 202 190, 238 158
       C 272 128, 318 104, 374 96
       C 404 92, 418 112, 406 140
       C 390 178, 340 210, 290 232
       C 252 248, 210 256, 164 256 Z"
    fill="#FFFFFF"
  />

  <!--
    LOWER WING (Hindwing): Sweeps down-right from same pivot point (164, 256)
    Swallowtail hindwing — slightly smaller, with characteristic pointed tail tip
  -->
  <path
    d="M 164 256
       C 210 256, 252 264, 290 280
       C 336 300, 382 328, 406 366
       C 422 392, 408 416, 378 414
       C 322 410, 268 378, 234 350
       C 200 322, 178 290, 164 256 Z"
    fill="#FFFFFF"
  />

  <!-- Swallowtail Tail Extension on lower wing (signature detail) -->
  <path
    d="M 330 390
       C 338 398, 350 416, 342 428
       C 334 440, 316 438, 304 424
       C 298 416, 302 404, 314 400
       C 320 398, 326 394, 330 390 Z"
    fill="#FFFFFF"
  />

  <!-- Tiny pivot dot at wing junction (thorax detail) -->
  <circle cx="164" cy="256" r="8" fill="#FFFFFF"/>
</svg>