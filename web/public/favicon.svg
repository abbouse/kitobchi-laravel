<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05011D" />
      <stop offset="50%" stop-color="#0A033D" />
      <stop offset="100%" stop-color="#12065E" />
    </linearGradient>

    <!-- Electric Sapphire Blue (Layer Depth) -->
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D68FF" />
      <stop offset="100%" stop-color="#5B8EFF" />
    </linearGradient>

    <!-- Pure Brilliant White (Front Faces) -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF4FF" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="280" cy="240" r="160" fill="#2D68FF" opacity="0.22" filter="blur(28px)" />

  <!-- ================= THE MASTERPIECE: SOARING WINGS K-BOOK ================= -->
  <g filter="url(#shadow)">
    <!-- BACK LAYER: Sapphire Blue Under-Wing / Under-Page (Adds 3D Layered Motion) -->
    <!-- Upper Back Feather/Page -->
    <path
      d="M 230 236
         C 246 160, 298 90, 404 74
         C 424 70, 436 92, 422 110
         C 382 166, 308 214, 230 236 Z"
      fill="url(#sapphireGrad)"
    />

    <!-- Lower Back Feather/Page -->
    <path
      d="M 230 276
         C 308 298, 382 346, 422 402
         C 436 420, 424 442, 404 438
         C 298 422, 246 352, 230 276 Z"
      fill="url(#sapphireGrad)"
    />

    <!-- FRONT LAYER: Pure White Soaring Wings / Open Pages -->
    <!-- Left Vertical Spine Pillar (The Stem of K / Pillar of Wisdom) -->
    <rect x="116" y="96" width="56" height="320" rx="28" fill="url(#whiteGrad)" />

    <!-- Upper Main Flying Wing / Page (Top Arm of K) -->
    <path
      d="M 194 246
         C 206 182, 252 116, 358 102
         C 388 98, 404 124, 388 154
         C 346 226, 258 248, 194 246 Z"
      fill="url(#whiteGrad)"
    />

    <!-- Lower Main Flying Wing / Page (Bottom Arm of K) -->
    <path
      d="M 194 266
         C 258 264, 346 286, 388 358
         C 404 388, 388 414, 358 410
         C 252 396, 206 330, 194 266 Z"
      fill="url(#whiteGrad)"
    />

    <!-- Center Fold Overlap Ribbon in Electric Accent Blue -->
    <path
      d="M 164 228
         C 188 228, 230 240, 250 256
         C 230 272, 188 284, 164 284
         Z"
      fill="url(#sapphireGrad)"
    />
  </g>
</svg>