<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Primary Color Background: Kitobchi #0b0342 -->
  <rect width="512" height="512" rx="115" fill="#0b0342"/>

  <!-- Organic Swallowtail Butterfly forming K -->
  <!-- Upper Forewing: large, sweeps up-right -->
  <path
    d="M 168 258
       C 185 220, 220 175, 266 145
       C 308 116, 360 100, 408 96
       C 432 94, 442 112, 428 136
       C 406 174, 356 204, 300 226
       C 258 242, 210 254, 168 258 Z"
    fill="#FFFFFF"
  />

  <!-- Lower Hindwing: sweeps down-right with swallowtail tail -->
  <path
    d="M 168 262
       C 210 258, 258 268, 300 284
       C 352 306, 400 336, 424 374
       C 438 396, 430 416, 408 416
       C 362 416, 310 390, 272 362
       C 234 334, 208 298, 168 262 Z"
    fill="#FFFFFF"
  />

  <!-- Swallowtail elegant pointed tail on hindwing -->
  <path
    d="M 370 392
       C 384 408, 390 428, 378 440
       C 366 452, 346 446, 340 430
       C 334 416, 344 404, 358 400
       C 364 398, 368 394, 370 392 Z"
    fill="#FFFFFF"
  />

  <!-- Butterfly body / thorax dot at wing junction (K joint) -->
  <circle cx="168" cy="260" r="10" fill="#FFFFFF"/>
</svg>