<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Soft shadow gradient for multi-layered book pages -->
    <linearGradient id="pageShadowUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#195498" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2980DD" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="pageShadowLower" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#195498" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2980DD" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background: Kitobchi App Primary Blue (#2980DD) -->
  <rect width="512" height="512" rx="115" fill="#2980DD"/>

  <!-- Left Vertical Book Spine (K Stem) -->
  <rect x="96" y="88" width="64" height="336" rx="32" fill="#FFFFFF"/>

  <!-- ===== UPPER WING (Multi-layered Book Pages) ===== -->
  <!-- Base Outer Wing -->
  <path
    d="M 168 256
       C 168 185, 216 116, 310 92
       C 355 80, 416 85, 416 128
       C 416 168, 335 218, 256 238
       C 216 248, 188 256, 168 256 Z"
    fill="#FFFFFF"
  />

  <!-- Page 2 Layer (Middle Page Fold Shadow) -->
  <path
    d="M 198 250
       C 220 205, 268 140, 345 110
       C 375 98, 410 105, 404 125
       C 390 155, 318 200, 245 226
       C 220 235, 205 244, 198 250 Z"
    fill="url(#pageShadowUpper)"
  />

  <!-- Page 3 Delicate Feather Fold Curve (Pure White Accent) -->
  <path
    d="M 215 244
       C 240 195, 290 148, 360 124
       C 382 116, 400 120, 396 130
       C 385 155, 320 195, 255 220
       C 232 229, 220 238, 215 244 Z"
    fill="#FFFFFF"
    opacity="0.9"
  />


  <!-- ===== LOWER WING (Multi-layered Book Pages) ===== -->
  <!-- Base Outer Wing -->
  <path
    d="M 168 256
       C 188 256, 216 264, 256 274
       C 335 294, 416 344, 416 384
       C 416 427, 355 432, 310 420
       C 216 396, 168 327, 168 256 Z"
    fill="#FFFFFF"
  />

  <!-- Page 2 Layer (Middle Page Fold Shadow) -->
  <path
    d="M 198 262
       C 205 268, 220 277, 245 286
       C 318 312, 390 357, 404 387
       C 410 407, 375 414, 345 402
       C 268 372, 220 307, 198 262 Z"
    fill="url(#pageShadowLower)"
  />

  <!-- Page 3 Delicate Feather Fold Curve (Pure White Accent) -->
  <path
    d="M 215 268
       C 220 274, 232 283, 255 292
       C 320 317, 385 357, 396 382
       C 400 392, 382 396, 360 388
       C 290 364, 240 317, 215 268 Z"
    fill="#FFFFFF"
    opacity="0.9"
  />
</svg>