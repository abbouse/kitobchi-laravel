<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Pure White Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Centered Minimalist Typography (NO Domain text) -->
  <g transform="translate(600, 290)" text-anchor="middle">

    <!-- Opening Quote Mark -->
    <text x="0" y="-70" font-family="'Georgia', 'Times New Roman', serif" font-size="72" font-style="italic" fill="#94A3B8" opacity="0.45">
      “
    </text>

    <!-- Large Wise Quote -->
    <text x="0" y="0" font-family="'Georgia', 'Times New Roman', serif" font-size="48" font-weight="500" fill="#0F172A" letter-spacing="0.5">
      Kitob — bilim manbai, ko‘ngil chirog‘idir.
    </text>

    <!-- Author -->
    <text x="0" y="80" font-family="'Georgia', 'Times New Roman', serif" font-size="26" font-style="italic" fill="#64748B">
      — Alisher Navoiy
    </text>

  </g>
</svg>
