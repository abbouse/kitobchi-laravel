<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Pure White Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Centered Minimalist Typography Container -->
  <g transform="translate(600, 260)" text-anchor="middle">

    <!-- Opening Quote Mark -->
    <text x="0" y="-50" font-family="'Georgia', 'Times New Roman', serif" font-size="64" font-style="italic" fill="#94A3B8" opacity="0.5">
      “
    </text>

    <!-- Wise Quote from Alisher Navoiy -->
    <text x="0" y="20" font-family="'Georgia', 'Times New Roman', serif" font-size="44" font-weight="400" fill="#0F172A" letter-spacing="0.5">
      Kitob — bilim manbai, ko‘ngil chirog‘idir.
    </text>

    <!-- Author -->
    <text x="0" y="85" font-family="'Georgia', 'Times New Roman', serif" font-size="24" font-style="italic" fill="#64748B">
      — Alisher Navoiy
    </text>

    <!-- Minimalist Divider Line -->
    <line x1="-40" y1="140" x2="40" y2="140" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Subtle Footer Domain -->
    <text x="0" y="180" font-family="'Urbanist', -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="5" fill="#94A3B8">
      KITOBCI.COM
    </text>

  </g>
</svg>
